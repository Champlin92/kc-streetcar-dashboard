<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.65" />

  <!-- Overhead Catenary & Pantograph -->
  <line x1="14" y1="10" x2="50" y2="10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M26 17 L32 10 L38 17" fill="none" stroke="url(#grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Streetcar Body -->
  <rect x="16" y="17" width="32" height="30" rx="6" fill="#1e293b" stroke="url(#grad)" stroke-width="2.5" />

  <!-- Destination Header Sign -->
  <line x1="25" y1="21.5" x2="39" y2="21.5" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" />

  <!-- Windshield -->
  <rect x="20" y="25" width="24" height="11" rx="2.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />

  <!-- Headlights -->
  <circle cx="22.5" cy="41.5" r="2.2" fill="#10b981" />
  <circle cx="41.5" cy="41.5" r="2.2" fill="#10b981" />

  <!-- Center Bumper Grill -->
  <line x1="28.5" y1="41.5" x2="35.5" y2="41.5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Tracks / Rails -->
  <line x1="22" y1="47" x2="17" y2="55" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="42" y1="47" x2="47" y2="55" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="19" y1="51.5" x2="45" y2="51.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5" />
</svg>
